function openMirror(){return new Promise((resolve,reject)=>{

function writePrimary(data){
 const entries=[[KEY,data.inventory],[SALES_KEY,data.sales],[EXPENSES_KEY,data.expenses],[CONFIG,data.config],[SAVE_META,data.savedAt]];
 const backup=entries.map(([k])=>[k,localStorage.getItem(k)]);
 try{
  for(const [k,v] of entries)localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
  if(localStorage.getItem(SAVE_META)!==data.savedAt)throw Error('Verifica di scrittura fallita');
 }catch(e){

// Ogni operazione e' confermata solo dopo che almeno un archivio l'ha accettata.

async function markSaved(){
 const data=storageSnapshot();
 const tag=document.getElementById('autoSaveStatus');
 if(tag){tag.textContent='◌ Salvataggio in corso';tag.style.color='#ffcc65'}
 let primaryOK=false,mirrorOK=false;const errors=[];
 try{writePrimary(data);primaryOK=true}catch(e){errors.push('memoria locale: '+e.message)}
 // Esegui le scritture IndexedDB in ordine, senza far sovrascrivere una modifica recente.
 mirrorWriteQueue=mirrorWriteQueue.catch(()=>{}).then(async()=>{
  if(!mirrorDb)mirrorDb=await openMirror();
  await writeMirror(data);
 });
 if(primaryOK){
  // La copia principale e' gia stata scritta e riletta: non bloccare l'utente per il backup secondario.
  mirrorWriteQueue.catch(e=>console.warn('Backup IndexedDB non disponibile:',e));
  statusSaved(true);return true;
 }
 try{await mirrorWriteQueue;mirrorOK=true}catch(e){errors.push('archivio IndexedDB: '+e.message)}
 if(!mirrorOK){statusSaved(false,errors.join(' — '));throw Error('Salvataggio bloccato: '+errors.join(' — '))}
 statusSaved(true);
 return true;
}

function shrinkImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Impossibile leggere la foto'));
  reader.onload=()=>{
   const img=new Image();img.onerror=()=>reject(new Error('Il file non è una foto leggibile'));
   img.onload=()=>{
    const maxWidth=360,maxHeight=500,ratio=Math.min(1,maxWidth/img.width,maxHeight/img.height);
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.68));
   };img.src=reader.result;
  };reader.readAsDataURL(file);
 });
}
async function saveCard(e,id){
  if(e && e.preventDefault)e.preventDefault();
  const status=document.getElementById('cardSaveStatus');
  const button=document.getElementById('cardSaveButton');
  const tell=(message,isError=true)=>{if(status){status.textContent=message;status.style.color=isError?'#ff9fae':'#80e8bb'};if(isError)console.error('Mondocarte:',message)};
  try{
    const form=document.getElementById('cardForm');
    if(!form)throw new Error('Modulo non trovato. Chiudi e riapri la finestra.');
    // Read the actual controls directly; no reliance on inline form handlers.
    const field=(key)=>{const el=form.querySelector('[name="'+key+'"]');return el?String(el.value||'').trim():''};
    const data={name:field('name'),set:field('set'),number:field('number'),language:field('language'),condition:field('condition'),finish:field('finish'),cardtrader:field('cardtrader'),notes:field('notes')};
    data.image=inventory.find(c=>c.id===id)?.image||'';
    const upload=document.getElementById('cardImageFile');
    if(upload && upload.files && upload.files[0]){
      if(!upload.files[0].type.startsWith('image/'))throw new Error('Carica un file immagine valido.');
      data.image=await shrinkImage(upload.files[0]);
    }
    const numeric=(key)=>Number(field(key).replace(',','.'));
    data.qty=numeric('qty');data.price=numeric('price');data.cost=field('cost')===''?0:numeric('cost');
    if(!data.name){tell('Inserisci il nome della carta.');form.querySelector('[name="name"]').focus();return false}
    if(!Number.isInteger(data.qty)||data.qty<0){tell('Inserisci una quantità intera valida.');return false}
    if(!Number.isFinite(data.price)||data.price<0||!Number.isFinite(data.cost)||data.cost<0){tell('Inserisci valori corretti per prezzi e costo.');return false}
    if(button){button.disabled=true;button.textContent='Salvataggio…'}
    const now=new Date().toISOString();
    const old=inventory.find(c=>c.id===id);
    const next=inventory.slice();
    if(old){
      const history=Array.isArray(old.history)?old.history.slice():[];
      if(Number(old.price)!==data.price)history.push({at:now,price:data.price,source:'manuale'});
      next[next.indexOf(old)]={...old,...data,history,updatedAt:now};
    }else{
      next.push({...data,id:uid(),branch:branch||'tomstaff',createdAt:now,updatedAt:now,history:[{at:now,price:data.price,source:'manuale'}]});
    }
    // Un aumento delle copie genera un costo d'acquisto, solo se hai indicato il costo unitario.
    // Le vecchie carte gia' presenti prima di questa versione NON sono conteggiate retroattivamente.
    const addedQty=old?Math.max(0,data.qty-Number(old.qty||0)):data.qty;
    const purchase=addedQty>0&&data.cost>0?{id:uid(),branch:old?old.branch:(branch||'tomstaff'),at:now,description:'Acquisto '+data.name+' ('+addedQty+' '+(addedQty===1?'copia':'copie')+')',category:'Carta Pokémon',amount:Math.round(addedQty*data.cost*100)/100,automatic:true,cardId:old?old.id:next[next.length-1].id}:null;
    const nextExpenses=purchase?expenses.concat(purchase):expenses;
    const prevInventory=inventory,prevExpenses=expenses;inventory=next;expenses=nextExpenses;
    try{await markSaved()}catch(err){inventory=prevInventory;expenses=prevExpenses;throw err}
    closeModal();render();
    // Visible non-blocking success feedback.
    showSaveToast(old?'Modifiche salvate correttamente':'Carta aggiunta correttamente al catalogo');
  }catch(err){
    tell('Impossibile aggiungere la carta: '+(err&&err.message?err.message:String(err)));
  }finally{
    const activeButton=document.getElementById('cardSaveButton');
    if(activeButton){activeButton.disabled=false;activeButton.textContent=id?'Salva modifiche':'Aggiungi al catalogo'}
  }
  return false;
}

  const xref=pdf.length;
  pdf+='xref\n0 '+objects.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size '+objects.length+' /Root '+catalog+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  download(new Uint8Array(Array.from(pdf,c=>c.charCodeAt(0))),'Mondocarte_Catalogo_'+branch+'_'+new Date().toISOString().slice(0,10)+'.pdf','application/pdf');
 }catch(e){console.error('Esportazione PDF:',e);alert('Impossibile creare il PDF: '+e.message)}
}
function exportJSON(){download(JSON.stringify({app:'Mondocarte',version:1,exportedAt:new Date().toISOString(),inventory,sales,expenses,config},null,2),'Mondocarte_backup_'+new Date().toISOString().slice(0,10)+'.json','application/json')}
function exportCSV(){let fields=['branch','name','set','number','language','condition','finish','qty','price','cost','image','cardtrader','notes'];const enc=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let lines=[fields.join(';'),...inventory.filter(c=>c.branch===branch).map(c=>fields.map(k=>enc(c[k])).join(';'))];download('\ufeff'+lines.join('\r\n'),'Mondocarte_'+branch+'.csv','text/csv;charset=utf-8')}
function importJSON(ev){let file=ev.target.files?.[0];ev.target.value='';if(!file)return;file.text().then(async txt=>{let obj=JSON.parse(txt),rows=Array.isArray(obj)?obj:obj.inventory;if(!Array.isArray(rows)||!rows.every(x=>x&&typeof x.name==='string'&&BRANCHES[x.branch]&&Number.isFinite(Number(x.price))&&Number.isFinite(Number(x.qty))))throw Error('Formato non valido');if(!confirm('L’importazione sostituirà tutto l’inventario attuale. Procedere?'))return;const previous=storageSnapshot();inventory=rows.map(x=>({...x,id:String(x.id||uid()),name:String(x.name),qty:Math.max(0,Math.trunc(Number(x.qty))),price:Math.max(0,Number(x.price)),history:Array.isArray(x.history)?x.history:[]}));sales=Array.isArray(obj.sales)?obj.sales.filter(x=>x&&BRANCHES[x.branch]&&Number.isFinite(Number(x.qty))&&Number.isFinite(Number(x.total))):[];expenses=Array.isArray(obj.expenses)?obj.expenses.filter(x=>x&&BRANCHES[x.branch]&&Number.isFinite(Number(x.amount))&&Number(x.amount)>=0):[];if(obj.config&&typeof obj.config==='object'){config=obj.config}try{await markSaved()}catch(e){restoreSnapshot(previous);throw e}render();alert('Inventario importato: '+inventory.length+' referenze.')}).catch(e=>alert('Importazione non riuscita: '+e.message))}
function openSettings(){openModal(`<div class="modalhead"><div><span class="eyebrow">Mondocarte</span><h2>Impostazioni e prezzi</h2></div><button class="btn icon" onclick="closeModal()">✕</button></div><div class="notice">Per aggiornare i prezzi da CardTrader servono dati autorizzati e un servizio che filtri sia la lingua della carta (italiano) sia il Paese del venditore (Italia). Non inserire chiavi API segrete in questa pagina.</div><form onsubmit="saveSettings(event)"><div class="field"><label>Endpoint HTTPS del tuo servizio prezzi (opzionale)</label><input name="endpoint" type="url" value="${escapeHtml(config.endpoint||'')}" placeholder="https://tuodominio.it/api/prezzi-mondocarte"><small>Il servizio deve accettare una richiesta POST JSON con <code>{ source: "CardTrader", filters: { card_language: "it", seller_country: "IT" }, cards: [...] }</code> e restituire <code>{ appliedFilters: { card_language: "it", seller_country: "IT" }, prices: [{ id, price }] }</code>. Prezzi senza conferma dei due filtri vengono rifiutati. Configura il CORS se ospitato altrove. I prezzi vengono controllati soltanto quando premi «↻ Controlla prezzi». Non sono previsti aggiornamenti automatici programmati.</small></div><div class="settingsbox"><strong>Stato aggiornamenti</strong><p class="mini">Ultima verifica: ${config.lastCheck?new Date(config.lastCheck).toLocaleString('it-IT'):'mai'}<br>Modalità: ${config.endpoint?'endpoint configurato':'prezzi manuali'}. Nessun controllo viene eseguito in automatico: premi «↻ Controlla prezzi» nel catalogo per avviarlo.</p></div><div class="modalfooter"><button type="button" class="btn" onclick="closeModal()">Chiudi</button><button class="btn primary" type="submit">Salva</button></div></form>`)}
async function saveSettings(e){e.preventDefault();const old={...config};config.endpoint=String(new FormData(e.target).get('endpoint')||'').trim();if(config.endpoint&&!/^https:\/\//.test(config.endpoint)){config=old;alert('Inserisci un URL HTTPS.');return}try{await saveConfig();closeModal();render()}catch(err){config=old;alert(err.message)}}
let updating=false;
async function refreshPrices(silent=false){
 if(updating)return;
 if(!config.endpoint){
  if(!silent){showSaveToast('Servizio prezzi non collegato: apri le Impostazioni.',true);openSettings()}
  return;
 }
 const cards=inventory.filter(c=>c.language==='Italiano');
 if(!cards.length){if(!silent)alert('Non ci sono carte in lingua italiana da controllare.');return}
 updating=true;
 try{
  const response=await fetch(config.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'CardTrader',filters:{card_language:'it',seller_country:'IT'},cards:cards.map(c=>({id:c.id,name:c.name,set:c.set,number:c.number,language:c.language,condition:c.condition,finish:c.finish,cardtrader:c.cardtrader||''}))})});
  if(!response.ok)throw Error('Il servizio prezzi ha risposto con HTTP '+response.status);
  const payload=await response.json();
  if(!Array.isArray(payload.prices))throw Error('Risposta senza elenco prezzi');
  if(payload.appliedFilters?.card_language!=='it'||payload.appliedFilters?.seller_country!=='IT')throw Error('Il servizio non conferma lingua italiana e venditori in Italia. Nessun prezzo modificato.');
  const previous=storageSnapshot(),now=new Date().toISOString();let count=0;
  for(const p of payload.prices){
   const c=inventory.find(x=>x.id===p.id&&x.language==='Italiano');
   const amount=Number(p.price);
   if(!c||p.price===null||p.price===undefined||!Number.isFinite(amount)||amount<0)continue;
   if(amount!==Number(c.price)){
    c.history=Array.isArray(c.history)?c.history:[];
    c.history.push({at:now,price:amount,source:'CardTrader · lingua IT · venditore IT'});
    c.price=amount;c.updatedAt=now;count++;
   }
  }
  config.lastCheck=now;
  try{await markSaved()}catch(e){restoreSnapshot(previous);throw e}
  render();
  if(!silent)alert('Controllo completato. Prezzi aggiornati: '+count+'.');
 }catch(e){
  const isNetwork=e instanceof TypeError;
  if(!silent)alert(isNetwork?'Servizio prezzi non raggiungibile: verifica indirizzo HTTPS, disponibilità e autorizzazione CORS. Un unico file HTML non può contattare direttamente l’API privata CardTrader.':'Controllo prezzi non completato: '+e.message);
  console.error('Mondocarte controllo prezzi',e);
 }finally{updating=false}
}
async function boot(){
 // Versione autonoma HTML: niente server locale /api/state.
 // Salva nel browser (localStorage e IndexedDB) e permette backup JSON.
 serverMode=false;
 render();
 await initMirror();
}
window.addEventListener('unhandledrejection',ev=>{console.error('Mondocarte:',ev.reason);statusSaved(false,ev.reason?.message||'Errore imprevisto')});
boot();
